[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "amb-sentinel"
version = "1.0.0"
description = "Autonomous local-first AI agent service: tool use, PostgreSQL storage, scheduled analysis, built-in log monitoring"
readme = "README.md"
requires-python = ">=3.10"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
authors = [{ name = "AMB Team" }]
keywords = ["llm", "agent", "local-llm", "automation", "monitoring"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Core = what `sentinel run --no-agent` and every CLI command need.
dependencies = [
  "PyYAML>=6.0.1",
  "python-dotenv>=1.0.1",
  "platformdirs>=4.2",
  "rich>=13.7.1",
  "colorama>=0.4.6",
  "httpx>=0.27",
  "requests>=2.31",
  "aiohttp>=3.9",
  "psutil>=5.9.8",
  "APScheduler>=3.10.4",
  "psycopg2-binary>=2.9.9",
  "pgvector>=0.2.5",
  "redis>=5.0.4",
  "numpy>=1.26",
  "filelock>=3.14",
  "textual>=1.0",
]

[project.optional-dependencies]
web     = ["beautifulsoup4>=4.12.3", "lxml>=5.2", "feedparser>=6.0.11", "playwright>=1.44"]
docs    = ["pdfminer.six>=20221105", "pypdf>=4.0", "python-docx>=1.1.2", "python-pptx>=1.0", "openpyxl>=3.1.2",
           "Pillow>=10.3", "pytesseract>=0.3.13"]
media   = ["yt-dlp>=2024.5.1", "faster-whisper>=1.0", "openai-whisper>=20231117"]
ml      = ["torch>=2.2", "transformers>=4.40", "sentence-transformers>=3.0", "tiktoken>=0.7"]
openai  = ["openai>=1.25"]
llama   = ["llama-cpp-python>=0.2.77"]     # native build — see README for CMAKE_ARGS
gpt4all = ["gpt4all>=2.7"]
sql     = ["SQLAlchemy>=2.0.30", "PyMySQL>=1.1"]
tui     = ["textual>=8.2.1"]
all     = ["amb-sentinel[web,docs,media,ml,openai,sql,tui]"]   # llama/gpt4all excluded on purpose
dev     = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10", "types-PyYAML", "build", "twine", "deptry"]

[project.scripts]
sentinel      = "amb_sentinel.cli:main"
amb           = "amb_sentinel.cli:main"
sentinel-logs = "amb_sentinel.logmon.cli:main"
amb-logs      = "amb_sentinel.logmon.cli:main"
amb-db-setup   = "amb_sentinel.dbsetup:main"
amb-trace      = "amb_sentinel.trace_cli:main"
amb-llm-config = "amb_sentinel.llm_config:main"

[project.urls]
Repository = "https://github.com/michealbamidele147-cmd/AMB-APP"
Issues     = "https://github.com/michealbamidele147-cmd/AMB-APP/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
amb_sentinel = ["data/*.yaml", "data/*.sql", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
  # Real E-level checks we keep: E1, E2, E3, E7 (E701/E741 aside), E9
  # F-level: F401-F847 real, minus F541/F841 handled below
  # B-level: B005, B904, B905 kept ON (see below)

  "E501",   # line too long — many intentional long error strings
  "E402",   # import after module code — env/config-before-torch pattern, intentional
  "E701",   # multiple statements on one line — original code style
  "E741",   # ambiguous variable name `l` — legacy but functional
  "F541",   # f-string without placeholders — cosmetic
  "F841",   # unused variable — many are intentional fire-and-forget futures / dead code
  "I001",   # import sort order — 500+ line diff, zero functional change
  "W291",   # trailing whitespace — cosmetic
  "W293",   # blank line with whitespace — cosmetic
  "B007",   # unused loop variable — style
  "B027",   # empty non-abstract method in ABC — `cleanup()` is an optional hook
  "B028",   # warnings.warn stacklevel — cosmetic for an application (not a library)

  # pyupgrade would rewrite every type hint across 20 files. Modernization,
  # not a bug. Ignore entirely. Revisit as a post-1.0.0 exercise.
  "UP006", "UP007", "UP008", "UP015", "UP017",
  "UP024", "UP035", "UP037", "UP041", "UP042", "UP045",
]

[tool.ruff.lint.per-file-ignores]
# Guard imports in try/except ImportError blocks are intentional: the import
# itself is the availability probe. tools/__init__.py re-exports via `_mod.get()`
# assignment, so ruff cannot see the downstream uses.
"src/amb_sentinel/tools/__init__.py" = ["F401"]
"src/amb_sentinel/tools/http.py"     = ["F401"]
"src/amb_sentinel/tools/scrape.py"   = ["F401"]
"src/amb_sentinel/tools/utils.py"    = ["F401"]
"src/amb_sentinel/tools/extract.py"  = ["F401"]
"src/amb_sentinel/agent/ai_agent.py" = ["F401"]
"src/amb_sentinel/llm/model_manager.py" = ["F401"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
